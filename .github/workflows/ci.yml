name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The code both apps share. Needs only a JDK, so it also runs when the Android SDK is not available.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test -Pcinema.desktopOnly=true --console=plain
      - name: Core test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/

  # Cinema for Android TV.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners come with the Android SDK; use its newest sdkmanager to add platform 36.
      - name: Install Android platform 36
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        # The .ci suffix lets the device tests install this build beside the TV's own Cinema.
        run: ./gradlew testDebugUnitTest assembleDebug -Pcinema.appIdSuffix=.ci --console=plain
      - name: Keep the debug APK for the device tests
        uses: actions/upload-artifact@v4
        with:
          name: cinema-ci-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

  # Cinema for Linux and the Steam Deck (the Flatpak's jars).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Desktop tests and Linux bundle
        run: ./gradlew :desktop:test :desktop:linuxBundle -Pcinema.linux=true -Pcinema.desktopOnly=true --console=plain
      - name: Desktop test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-test-report
          path: desktop/build/reports/tests/
      - name: Keep the jars for the Flatpak build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: desktop/build/linux
          retention-days: 7

  # The Flatpak bundle, built on GitHub's x86-64 runners (compiling mpv is too heavy for the Deck). Its build cache
  # keeps repeat runs short. The device tests install this bundle on the Steam Deck.
  flatpak:
    needs: desktop
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-linux
          path: desktop/build/linux
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Cinema.flatpak
          manifest-path: flatpak/io.github.danielportelabyrne.Cinema.yml
          cache-key: flatpak-builder-${{ github.sha }}
          restore-cache: true
          upload-artifact: false
      - name: Keep the bundle for the device tests
        uses: actions/upload-artifact@v4
        with:
          name: cinema-flatpak
          path: Cinema.flatpak
          retention-days: 7
