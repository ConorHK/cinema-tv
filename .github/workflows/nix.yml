name: Nix

# Builds the Android TV APK the way `nix build` does, on GitHub's runners. The offline dependency lock
# (nix/deps.json) goes stale whenever a Gradle plugin or dependency changes, and the Android SDK Nix fetches is
# too heavy to build on a laptop, so this catches it on the pull request.
on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "flake.*"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "nix/**"
      - "flake.*"
      - "**/*.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/nix.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The Android SDK and Nix's own copy do not both fit on a runner's disk; this one is not needed.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h / | tail -1
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Build the APK with Nix
        run: nix build .#cinema-tv --print-build-logs
      - name: Keep the unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: cinema-tv-nix-apk
          path: result/cinema-tv-unsigned.apk
          retention-days: 7
